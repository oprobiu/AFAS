name: Build and Release .apkg

on:
  workflow_call:
    inputs:
      deck-configs:
        required: false
        type: string
        default: 'data/deck.json'
        description: 'Comma-separated list of deck.json paths (e.g. data/ro/deck.json,data/en/deck.json)'
      tools-version:
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout dataset repo
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }

      - name: Checkout AFAS tools
        uses: actions/checkout@v4
        with:
          repository: oprobiu/AFAS
          ref: ${{ inputs.tools-version }}
          path: .tools/AFAS

      - name: Install dependencies
        run: pip install -r .tools/AFAS/requirements.txt

      - name: Build all decks
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          IFS=',' read -ra CONFIGS <<< "${{ inputs.deck-configs }}"
          for cfg in "${CONFIGS[@]}"; do
            cfg=$(echo "$cfg" | xargs)
            echo "=== Validating $cfg ==="
            python3 .tools/AFAS/scripts/validate.py --config "$cfg" --tools-dir .tools/AFAS

            echo "=== Building $cfg ==="
            python3 .tools/AFAS/scripts/build_apkg.py --config "$cfg" --tools-dir .tools/AFAS

            # Rename: <level>-<na>-<fo>-<tag>.apkg  (e.g. A1-ro-de-v1.1.0.apkg)
            SRC=$(ls -t build/*.apkg | head -1)
            NAME=$(python3 -c "
          import json, os
          cfg = json.load(open('$cfg'))
          level = cfg['deck_name'].split()[0]
          fo = cfg.get('tts',{}).get('language','xx').split('-')[0]
          na = os.path.basename(os.path.dirname(os.path.abspath('$cfg')))
          if na == 'data': na = 'xx'
          print(f'{level}-{na}-{fo}-${TAG}')
          ")
            mv "$SRC" "build/${NAME}.apkg"
            echo "  → build/${NAME}.apkg"
          done

      - name: Create or update release
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | while read name; do
            gh release delete-asset "$TAG" "$name" -y 2>/dev/null || true
          done
          for f in build/*.apkg; do
            gh release upload "$TAG" "$f" --clobber
          done
        env:
          GH_TOKEN: ${{ github.token }}
