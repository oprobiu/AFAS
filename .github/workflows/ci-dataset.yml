name: Validate dataset

on:
  workflow_call:
    inputs:
      deck-configs:
        required: false
        type: string
        default: 'data/deck.json'
        description: 'Comma-separated list of deck.json paths'
      tools-version:
        required: true
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dataset repo
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }

      - name: Checkout AFAS tools
        uses: actions/checkout@v4
        with:
          repository: oprobiu/AFAS
          ref: ${{ inputs.tools-version }}
          path: .tools/AFAS

      - name: Install dependencies
        run: pip install -r .tools/AFAS/requirements.txt

      - name: Validate all decks
        run: |
          IFS=',' read -ra CONFIGS <<< "${{ inputs.deck-configs }}"
          for cfg in "${CONFIGS[@]}"; do
            cfg=$(echo "$cfg" | xargs)
            echo "=== Validating $cfg ==="
            python3 .tools/AFAS/scripts/validate.py --config "$cfg" --tools-dir .tools/AFAS
          done
